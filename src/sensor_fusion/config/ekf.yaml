# Extended Kalman Filter (EKF) Configuration for Drone Sensor Fusion
fusion_node:
  ros__parameters:
    # Process Noise Covariances
    process_noise_accel: 0.01
    process_noise_gyro: 0.001

    # Measurement Noise Covariances
    measurement_noise_vo: 0.05
    measurement_noise_gps: 1.5
    measurement_noise_baro: 0.2

    # Sensor Usage Flags
    use_imu: true
    use_gps: true
    use_visual_odometry: true

    # Coordinate Frames
    world_frame: "odom"
    base_frame: "base_link"
